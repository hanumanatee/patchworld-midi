
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Patchworld YouTube Muted Autoplay Test</title>

<style>
body {
    background: #181818;
    color: #eeeeee;
    font-family: monospace;
    padding: 20px;
    font-size: 16px;
}

h2 { color: #80dfff; }

#player {
    width: 100%;
    max-width: 640px;
    aspect-ratio: 16 / 9;
    background: black;
}

#status {
    background: #303030;
    border: 1px solid #666;
    padding: 15px;
    margin: 15px 0;
    font-size: 18px;
}

#log {
    background: #101010;
    border: 1px solid #555;
    padding: 10px;
    height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

button {
    font-size: 16px;
    padding: 10px;
    margin: 5px;
}
</style>

<script src="patchworld-bridge.js"></script>

</head>

<body>

<h2>Patchworld YouTube Muted Autoplay Test</h2>

<div id="player"></div>

<div id="status">Initializing...</div>

<button onclick="startMuted()">Start Muted</button>
<button onclick="attemptUnmute()">Unmute</button>
<button onclick="pauseVideo()">Pause</button>
<button onclick="checkMute()">Check Mute</button>

<h3>Event Log</h3>

<div id="log"></div>

<script>

// ---------------------------------------------
// Configuration
// ---------------------------------------------

const VIDEO_ID = "M7lc1UVf-VE";
const PLAY_CHANNEL = "Play";

// ---------------------------------------------
// State
// ---------------------------------------------

let player = null;
let playerReady = false;
let pendingPlay = false;
let unmuteAttempted = false;

const status = document.getElementById("status");
const log = document.getElementById("log");

// ---------------------------------------------
// Logging
// ---------------------------------------------

function addLog(message) {

    const time = new Date().toLocaleTimeString();
    const line = time + "  " + message;

    log.textContent += line + "\n";
    log.scrollTop = log.scrollHeight;

    console.log(line);
}

// ---------------------------------------------
// Check mute state
// ---------------------------------------------

function checkMute() {

    if (!playerReady) return;

    const muted = player.isMuted();
    const volume = player.getVolume();

    addLog(
        "Mute state: " + muted +
        " | Volume: " + volume
    );

    status.textContent =
        "Muted: " + muted +
        " | Volume: " + volume;
}

// ---------------------------------------------
// Start playback muted
// ---------------------------------------------

function startMuted() {

    if (!playerReady) {

        pendingPlay = true;

        addLog("Play pending - player not ready");

        return;
    }

    pendingPlay = false;
    unmuteAttempted = false;

    addLog("Muting player");

    player.mute();

    addLog("Requesting muted playback");

    player.playVideo();
}

// ---------------------------------------------
// Attempt automatic unmute
// ---------------------------------------------

function attemptUnmute() {

    if (!playerReady) return;

    addLog("Attempting UNMUTE");

    player.setVolume(100);
    player.unMute();

    // Check immediately.
    checkMute();

    // Check again after the browser processes
    // the unmute request.
    setTimeout(function() {

        addLog("Delayed mute-state check");

        checkMute();

    }, 1000);
}

// ---------------------------------------------
// Pause
// ---------------------------------------------

function pauseVideo() {

    if (!playerReady) return;

    addLog("API command: PAUSE");

    player.pauseVideo();
}

// ---------------------------------------------
// Patchworld Web Bridge
// ---------------------------------------------

PatchWorld.onData = async function(context) {

    addLog("Patchworld bridge connected");

    try {

        await PatchWorld.subscribeWifi(PLAY_CHANNEL);

        addLog(
            "Subscribed to wireless: " +
            PLAY_CHANNEL
        );

        status.textContent =
            "Bridge connected - waiting for Play";

    } catch (error) {

        addLog("Subscription error: " + error);
    }
};

// ---------------------------------------------
// Wireless Play jolt
// ---------------------------------------------

PatchWorld.onWifiJolt = function(channel, value) {

    addLog(
        "Wireless received: " +
        channel + " = " + value
    );

    if (channel === PLAY_CHANNEL) {

        addLog("PLAY JOLT RECEIVED");

        startMuted();
    }
};

// ---------------------------------------------
// YouTube API initialization
// ---------------------------------------------

function onYouTubeIframeAPIReady() {

    addLog("YouTube API loaded");

    player = new YT.Player("player", {

        width: "640",
        height: "360",

        videoId: VIDEO_ID,

        playerVars: {
            autoplay: 0,
            playsinline: 1,
            controls: 1,
            enablejsapi: 1
        },

        events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange,
            onError: onPlayerError,
            onAutoplayBlocked: onAutoplayBlocked
        }
    });
}

// ---------------------------------------------
// Player ready
// ---------------------------------------------

function onPlayerReady(event) {

    playerReady = true;

    addLog("YouTube player ready");

    // Establish muted state before playback.
    player.mute();

    status.textContent =
        "Player ready - waiting for Play";

    if (pendingPlay) {

        addLog("Executing pending Play request");

        startMuted();
    }
}

// ---------------------------------------------
// Player state changes
// ---------------------------------------------

function onPlayerStateChange(event) {

    const states = {
        "-1": "Unstarted",
        "0": "Ended",
        "1": "Playing",
        "2": "Paused",
        "3": "Buffering",
        "5": "Video cued"
    };

    const state = states[event.data] || "Unknown";

    addLog("Player state: " + state);

    status.textContent =
        "Player state: " + state;

    if (
        event.data === YT.PlayerState.PLAYING &&
        !unmuteAttempted
    ) {

        unmuteAttempted = true;

        addLog("Muted playback succeeded");

        checkMute();

        // Allow playback to establish itself
        // before attempting to enable audio.
        setTimeout(function() {

            addLog("Automatic unmute test");

            attemptUnmute();

        }, 1500);
    }
}

// ---------------------------------------------
// Autoplay blocked
// ---------------------------------------------

function onAutoplayBlocked(event) {

    addLog("AUTOPLAY BLOCKED BY BROWSER");

    status.textContent =
        "AUTOPLAY BLOCKED";
}

// ---------------------------------------------
// Player errors
// ---------------------------------------------

function onPlayerError(event) {

    addLog("YouTube error: " + event.data);

    status.textContent =
        "YouTube error: " + event.data;
}

// ---------------------------------------------
// Keyboard diagnostic
// ---------------------------------------------

window.addEventListener("keydown", function(event) {

    addLog("Key: " + JSON.stringify(event.key));

    if (
        event.key.toLowerCase() === "k" &&
        !event.repeat
    ) {

        addLog("K received - starting muted");

        startMuted();
    }

}, true);

// ---------------------------------------------
// Load YouTube API
// ---------------------------------------------

const tag = document.createElement("script");

tag.src = "https://www.youtube.com/iframe_api";

document.head.appendChild(tag);

addLog("Muted autoplay test initialized");

</script>

</body>
</html>
