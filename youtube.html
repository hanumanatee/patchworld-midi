
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Patchworld YouTube Wireless Test</title>

<style>
body {
    background: #181818;
    color: #eeeeee;
    font-family: monospace;
    padding: 20px;
    font-size: 16px;
}

h2 { color: #80dfff; }

#player {
    width: 100%;
    max-width: 640px;
    aspect-ratio: 16 / 9;
    background: black;
}

#status {
    background: #303030;
    border: 1px solid #666;
    padding: 15px;
    margin: 15px 0;
    font-size: 18px;
}

#log {
    background: #101010;
    border: 1px solid #555;
    padding: 10px;
    height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

button {
    font-size: 16px;
    padding: 10px;
    margin: 5px;
}
</style>

<script src="patchworld-bridge.js"></script>

</head>

<body>

<h2>Patchworld YouTube Wireless Test</h2>

<div id="player"></div>

<div id="status">Initializing...</div>

<button onclick="startMuted()">Start Muted</button>
<button onclick="attemptUnmute()">Unmute</button>
<button onclick="pauseVideo()">Pause</button>
<button onclick="checkState()">Check State</button>

<h3>Event Log</h3>

<div id="log"></div>

<script>

// ---------------------------------------------
// Configuration
// ---------------------------------------------

const VIDEO_ID = "M7lc1UVf-VE";

const PLAY_CHANNEL = "Play";
const UNMUTE_CHANNEL = "Unmute";

// ---------------------------------------------
// State
// ---------------------------------------------

let player = null;
let playerReady = false;
let pendingPlay = false;

const status = document.getElementById("status");
const log = document.getElementById("log");

// ---------------------------------------------
// Logging
// ---------------------------------------------

function addLog(message) {

    const time = new Date().toLocaleTimeString();
    const line = time + "  " + message;

    log.textContent += line + "\n";
    log.scrollTop = log.scrollHeight;

    console.log(line);
}

// ---------------------------------------------
// Check player state
// ---------------------------------------------

function checkState() {

    if (!playerReady) return;

    const state = player.getPlayerState();
    const muted = player.isMuted();
    const volume = player.getVolume();

    const states = {
        "-1": "Unstarted",
        "0": "Ended",
        "1": "Playing",
        "2": "Paused",
        "3": "Buffering",
        "5": "Video cued"
    };

    const stateName = states[state] || "Unknown";

    const message =
        "State: " + stateName +
        " | Muted: " + muted +
        " | Volume: " + volume;

    addLog(message);

    status.textContent = message;
}

// ---------------------------------------------
// Start muted playback
// ---------------------------------------------

function startMuted() {

    if (!playerReady) {

        pendingPlay = true;

        addLog("Play pending - player not ready");

        return;
    }

    pendingPlay = false;

    addLog("Muting player");

    player.mute();

    addLog("Requesting muted playback");

    player.playVideo();
}

// ---------------------------------------------
// Unmute
// ---------------------------------------------

function attemptUnmute() {

    if (!playerReady) {

        addLog("Unmute ignored - player not ready");

        return;
    }

    addLog("UNMUTE REQUEST RECEIVED");

    addLog("State before unmute:");
    checkState();

    player.setVolume(100);
    player.unMute();

    addLog("Unmute command issued");

    // Allow the browser to process the command.

    setTimeout(function() {

        addLog("State after unmute:");
        checkState();

    }, 1000);
}

// ---------------------------------------------
// Pause
// ---------------------------------------------

function pauseVideo() {

    if (!playerReady) return;

    addLog("API command: PAUSE");

    player.pauseVideo();
}

// ---------------------------------------------
// Patchworld Web Bridge
// ---------------------------------------------

PatchWorld.onData = async function(context) {

    addLog("Patchworld bridge connected");

    try {

        await PatchWorld.subscribeWifi(PLAY_CHANNEL);

        addLog(
            "Subscribed to wireless: " +
            PLAY_CHANNEL
        );

        await PatchWorld.subscribeWifi(UNMUTE_CHANNEL);

        addLog(
            "Subscribed to wireless: " +
            UNMUTE_CHANNEL
        );

        status.textContent =
            "Bridge connected - waiting for Play";

    } catch (error) {

        addLog("Subscription error: " + error);
    }
};

// ---------------------------------------------
// Wireless jolts
// ---------------------------------------------

PatchWorld.onWifiJolt = function(channel, value) {

    addLog(
        "Wireless received: " +
        channel + " = " + value
    );

    if (channel === PLAY_CHANNEL) {

        addLog("PLAY JOLT RECEIVED");

        startMuted();
    }

    if (channel === UNMUTE_CHANNEL) {

        addLog("UNMUTE JOLT RECEIVED");

        attemptUnmute();
    }
};

// ---------------------------------------------
// YouTube API
// ---------------------------------------------

function onYouTubeIframeAPIReady() {

    addLog("YouTube API loaded");

    player = new YT.Player("player", {

        width: "640",
        height: "360",

        videoId: VIDEO_ID,

        playerVars: {
            autoplay: 0,
            playsinline: 1,
            controls: 1,
            enablejsapi: 1
        },

        events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange,
            onError: onPlayerError,
            onAutoplayBlocked: onAutoplayBlocked
        }
    });
}

// ---------------------------------------------
// Player ready
// ---------------------------------------------

function onPlayerReady(event) {

    playerReady = true;

    player.mute();

    addLog("YouTube player ready");

    status.textContent =
        "Player ready - waiting for Play";

    if (pendingPlay) {

        addLog("Executing pending Play request");

        startMuted();
    }
}

// ---------------------------------------------
// Player state changes
// ---------------------------------------------

function onPlayerStateChange(event) {

    const states = {
        "-1": "Unstarted",
        "0": "Ended",
        "1": "Playing",
        "2": "Paused",
        "3": "Buffering",
        "5": "Video cued"
    };

    const state = states[event.data] || "Unknown";

    addLog("Player state: " + state);

    status.textContent =
        "Player state: " + state;

    if (event.data === YT.PlayerState.PLAYING) {

        addLog("Playback confirmed");

        checkState();
    }
}

// ---------------------------------------------
// Autoplay blocked
// ---------------------------------------------

function onAutoplayBlocked(event) {

    addLog("AUTOPLAY BLOCKED BY BROWSER");

    status.textContent =
        "AUTOPLAY BLOCKED";
}

// ---------------------------------------------
// Player errors
// ---------------------------------------------

function onPlayerError(event) {

    addLog("YouTube error: " + event.data);

    status.textContent =
        "YouTube error: " + event.data;
}

// ---------------------------------------------
// Keyboard diagnostic
// ---------------------------------------------

window.addEventListener("keydown", function(event) {

    addLog("Key: " + JSON.stringify(event.key));

    if (event.key === "k" && !event.repeat) {

        startMuted();
    }

}, true);

// ---------------------------------------------
// Load YouTube API
// ---------------------------------------------

const tag = document.createElement("script");

tag.src = "https://www.youtube.com/iframe_api";

document.head.appendChild(tag);

addLog("Wireless playback test initialized");

</script>

</body>
</html>
