<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patchworld File Browse Test 2</title>

    <style>
        body {
            font-family: sans-serif;
            background: #181818;
            color: #eeeeee;
            margin: 30px;
        }

        .test {
            margin: 30px 0;
            padding: 20px;
            background: #282828;
            border-radius: 8px;
        }

        input {
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h1>Patchworld File Browse Test 2</h1>

<div class="test">
    <div>Unrestricted file input:</div>
    <input type="file">
</div>

<div class="test">
    <div>Image-only file input:</div>
    <input type="file" accept="image/*">
</div>

</body>
</html>
