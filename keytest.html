
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Patchworld YouTube Autoplay Test</title>

<style>
body {
    background: #181818;
    color: #eeeeee;
    font-family: monospace;
    padding: 20px;
    font-size: 16px;
}

h2 {
    color: #80dfff;
}

button, input {
    font-size: 16px;
    padding: 10px;
    margin: 4px;
}

input {
    width: 60%;
}

#player {
    width: 100%;
    max-width: 640px;
    aspect-ratio: 16 / 9;
    background: black;
}

#status {
    background: #303030;
    border: 1px solid #666;
    padding: 15px;
    font-size: 18px;
    margin: 15px 0;
}

#log {
    background: #101010;
    border: 1px solid #555;
    padding: 10px;
    height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
</style>
</head>

<body tabindex="0">

<h2>Patchworld YouTube Autoplay Test</h2>

<p>YouTube video URL or ID:</p>

<input id="videoInput"
       value="M7lc1UVf-VE">

<button onclick="loadVideo()">Load Video</button>

<br><br>

<div id="player"></div>

<div id="status">
    Initializing YouTube player...
</div>

<button onclick="playVideo()">Play</button>
<button onclick="pauseVideo()">Pause</button>
<button onclick="toggleVideo()">Toggle</button>

<button onclick="focusPage()">Focus Page</button>

<h3>Event Log</h3>

<div id="log"></div>

<script>

let player = null;
let playerReady = false;
let autoplayBlocked = false;

const status = document.getElementById("status");
const log = document.getElementById("log");


// -----------------------------------------------
// Logging
// -----------------------------------------------

function addLog(message) {

    const time = new Date().toLocaleTimeString();

    const line = time + "  " + message;

    log.textContent += line + "\n";

    log.scrollTop = log.scrollHeight;

    console.log(line);
}


// -----------------------------------------------
// Video ID extraction
// -----------------------------------------------

function getVideoId(value) {

    value = value.trim();

    if (/^[a-zA-Z0-9_-]{11}$/.test(value)) {
        return value;
    }

    try {

        const url = new URL(value);

        if (url.hostname.includes("youtu.be")) {
            return url.pathname.split("/")[1];
        }

        if (url.hostname.includes("youtube.com")) {

            if (url.pathname.startsWith("/shorts/")) {
                return url.pathname.split("/")[2];
            }

            if (url.pathname.startsWith("/embed/")) {
                return url.pathname.split("/")[2];
            }

            return url.searchParams.get("v");
        }

    } catch (e) {

        addLog("Invalid video URL");

    }

    return null;
}


// -----------------------------------------------
// YouTube API
// -----------------------------------------------

function onYouTubeIframeAPIReady() {

    addLog("YouTube API loaded");

    const videoId = getVideoId(
        document.getElementById("videoInput").value
    );

    player = new YT.Player("player", {

        width: "640",

        height: "360",

        videoId: videoId,

        playerVars: {

            autoplay: 1,

            mute: 0,

            playsinline: 1,

            controls: 1,

            enablejsapi: 1

        },

        events: {

            onReady: onPlayerReady,

            onStateChange: onPlayerStateChange,

            onError: onPlayerError,

            onAutoplayBlocked: onAutoplayBlocked

        }

    });

}


// -----------------------------------------------
// Player ready
// -----------------------------------------------

function onPlayerReady(event) {

    playerReady = true;

    addLog("Player ready");

    // Explicitly request audible playback.

    player.unMute();

    player.setVolume(100);

    addLog("Requesting autoplay with sound");

    player.playVideo();

    status.textContent =
        "Autoplay requested. Waiting for result...";

}


// -----------------------------------------------
// Autoplay blocked
// -----------------------------------------------

function onAutoplayBlocked(event) {

    autoplayBlocked = true;

    status.textContent =
        "AUTOPLAY BLOCKED BY BROWSER";

    addLog("AUTOPLAY BLOCKED");

}


// -----------------------------------------------
// Player state changes
// -----------------------------------------------

function onPlayerStateChange(event) {

    const states = {

        "-1": "Unstarted",

        "0": "Ended",

        "1": "Playing",

        "2": "Paused",

        "3": "Buffering",

        "5": "Video cued"

    };

    const state =
        states[event.data] || "Unknown";

    addLog("Player state: " + state);

    if (event.data === YT.PlayerState.PLAYING) {

        status.textContent =
            "PLAYING - Autoplay succeeded";

        addLog("Playback started");

    } else if (
        event.data === YT.PlayerState.PAUSED
    ) {

        status.textContent = "Paused";

    } else if (
        event.data === YT.PlayerState.BUFFERING
    ) {

        status.textContent = "Buffering...";

    }

}


// -----------------------------------------------
// Player errors
// -----------------------------------------------

function onPlayerError(event) {

    addLog("YouTube error: " + event.data);

    status.textContent =
        "YouTube error: " + event.data;

}


// -----------------------------------------------
// Manual playback controls
// -----------------------------------------------

function playVideo() {

    if (!playerReady) {
        addLog("Player not ready");
        return;
    }

    addLog("Manual PLAY");

    player.playVideo();

}


function pauseVideo() {

    if (!playerReady) {
        addLog("Player not ready");
        return;
    }

    addLog("Manual PAUSE");

    player.pauseVideo();

}


function toggleVideo() {

    if (!playerReady) {
        addLog("Player not ready");
        return;
    }

    if (
        player.getPlayerState() ===
        YT.PlayerState.PLAYING
    ) {

        pauseVideo();

    } else {

        playVideo();

    }

}


// -----------------------------------------------
// Load another video
// -----------------------------------------------

function loadVideo() {

    const videoId = getVideoId(
        document.getElementById("videoInput").value
    );

    if (!videoId) {
        addLog("Invalid video ID");
        return;
    }

    if (!playerReady) {
        addLog("Player not ready");
        return;
    }

    addLog("Loading video: " + videoId);

    player.loadVideoById(videoId);

}


// -----------------------------------------------
// Keyboard support
// -----------------------------------------------

function focusPage() {

    document.body.focus();

    addLog("Page focused");

}


window.addEventListener("keydown", function(event) {

    addLog(
        "Key: " + JSON.stringify(event.key)
    );

    if (
        event.key.toLowerCase() === "k" &&
        !event.repeat
    ) {

        toggleVideo();

    }

}, true);


// -----------------------------------------------
// Load YouTube API
// -----------------------------------------------

const tag = document.createElement("script");

tag.src =
    "https://www.youtube.com/iframe_api";

document.head.appendChild(tag);

addLog("Autoplay test initialized");

document.body.focus();

</script>

</body>
</html>
