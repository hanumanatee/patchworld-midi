<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patchworld MIDI Importer</title>

    <style>
        body {
            font-family: sans-serif;
            background: #181818;
            color: #eeeeee;
            margin: 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        #revision {
            font-weight: bold;
            margin-bottom: 20px;
        }

        .section {
            margin-top: 18px;
            padding: 14px;
            background: #282828;
            border-radius: 8px;
        }

        .label {
            color: #aaaaaa;
        }

        button {
            font-size: 18px;
            padding: 10px 18px;
            margin-top: 10px;
            margin-right: 8px;
        }

        pre {
            background: #111111;
            padding: 12px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            max-height: 400px;
            overflow-y: auto;
        }

        #status {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .good {
            color: #69d36f;
        }

        .bad {
            color: #ff6b6b;
        }

        .value {
            font-family: monospace;
        }
    </style>
</head>

<body>

    <div id="revision">REV 2</div>

    <h1>Patchworld MIDI Importer</h1>

    <div class="section">
        <div>
            <span class="label">Bridge:</span>
            <span id="bridgeStatus">Waiting...</span>
        </div>

        <div>
            <span class="label">Wireless:</span>
            <span id="wirelessStatus">Not subscribed</span>
        </div>

        <div>
            <span class="label">Source:</span>
            test_fourths_2chan.middt
        </div>
    </div>


    <div class="section">

        <button id="loadButton">
            Load and Parse MIDI Text
        </button>

        <button id="importButton" disabled>
            Start Import
        </button>

        <button id="abortButton" disabled>
            Abort
        </button>

    </div>


    <div class="section">

        <div id="status">
            Waiting.
        </div>

        <div>
            <span class="label">Playable events:</span>
            <span id="eventCount">-</span>
        </div>

        <div>
            <span class="label">Duration:</span>
            <span id="duration">-</span>
        </div>

        <div>
            <span class="label">Writes required:</span>
            <span id="writesRequired">-</span>
        </div>

    </div>


    <div class="section">

        <div>
            <span class="label">Current write:</span>
            <span id="currentWrite" class="value">-</span>
        </div>

        <div>
            <span class="label">Completed writes:</span>
            <span id="completedWrites">0</span>
        </div>

        <div>
            <span class="label">ACKs:</span>
            <span id="ackCount" class="good">0</span>
        </div>

        <div>
            <span class="label">NAKs:</span>
            <span id="nakCount" class="bad">0</span>
        </div>

        <div>
            <span class="label">Retries:</span>
            <span id="retryCount">0</span>
        </div>

    </div>


    <div class="section">
        <div class="label">Parsed event preview:</div>
        <pre id="preview">No MIDI loaded yet.</pre>
    </div>


    <!--
        Load Patchworld bridge with cache-busting timestamp.
    -->
    <script>
        document.write(
            '<script src="patchworld-bridge.js?t=' +
            Date.now() +
            '"><\/script>'
        );
    </script>


    <script>

        // =========================================================
        // CONFIGURATION
        // =========================================================

        const MIDI_FILENAME =
            "test_fourths_2chan.middt";


        const CHANNELS = {

            time: {
                index: "midi_time_index",
                value: "midi_time_value"
            },

            type: {
                index: "midi_type_index",
                value: "midi_type_value"
            },

            note: {
                index: "midi_note_index",
                value: "midi_note_value"
            },

            velocity: {
                index: "midi_velocity_index",
                value: "midi_velocity_value"
            },

            channel: {
                index: "midi_channel_index",
                value: "midi_channel_value"
            },

            ack: "midi_ack",

            nak: "midi_nak"
        };


        const FIELD_ORDER = [
            "time",
            "type",
            "note",
            "velocity",
            "channel"
        ];


        const MAX_RETRIES = 5;

        // Give Patchworld plenty of time before regarding
        // absence of ACK/NAK as a failed write.
        const ACK_TIMEOUT_MS = 2000;


        // =========================================================
        // STATE
        // =========================================================

        let parsedEvents = [];

        let bridgeReady = false;

        let wirelessReady = false;

        let importing = false;

        let abortRequested = false;

        let currentEventIndex = 0;

        let currentFieldIndex = 0;

        let completedWrites = 0;

        let ackCount = 0;

        let nakCount = 0;

        let retryCount = 0;

        let retryForCurrentWrite = 0;

        let waitingForResponse = false;

        let responseTimer = null;


        // =========================================================
        // MIDI PARSER
        // =========================================================

        function extractDeltaTime(line) {

            const match = line.match(
                /\btime=([-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?)/
            );

            if (!match) {
                return 0;
            }

            const value = Number(match[1]);

            return Number.isFinite(value)
                ? value
                : 0;
        }


        function extractNumber(line, fieldName) {

            const expression =
                new RegExp(
                    "\\b" +
                    fieldName +
                    "=([-+]?\\d+(?:\\.\\d+)?)"
                );

            const match =
                line.match(expression);

            if (!match) {
                return null;
            }

            const value =
                Number(match[1]);

            return Number.isFinite(value)
                ? value
                : null;
        }


        function parseMidiText(text) {

            const lines =
                text.split(/\r?\n/);

            const events = [];

            let absoluteTime = 0;


            for (const rawLine of lines) {

                const line =
                    rawLine.trim();

                if (line.length === 0) {
                    continue;
                }


                // ---------------------------------------------
                // IMPORTANT:
                //
                // Every MIDI message contributes its delta
                // time before we decide whether PW needs it.
                // ---------------------------------------------

                absoluteTime +=
                    extractDeltaTime(line);


                const isNoteOn =
                    line.startsWith("note_on ");

                const isNoteOff =
                    line.startsWith("note_off ");


                if (!isNoteOn && !isNoteOff) {
                    continue;
                }


                const channel =
                    extractNumber(
                        line,
                        "channel"
                    );

                const note =
                    extractNumber(
                        line,
                        "note"
                    );

                const velocity =
                    extractNumber(
                        line,
                        "velocity"
                    );


                if (
                    channel === null ||
                    note === null ||
                    velocity === null
                ) {

                    console.warn(
                        "Skipping malformed MIDI event:",
                        line
                    );

                    continue;
                }


                events.push({

                    index:
                        events.length,

                    time:
                        absoluteTime,

                    // Preserve the encoding used by the
                    // successful original PW MIDI patch:
                    //
                    // 5 = note on
                    // 6 = note off

                    type:
                        isNoteOn ? 5 : 6,

                    note:
                        note,

                    velocity:
                        velocity,

                    channel:
                        channel,

                    originalLine:
                        line
                });
            }


            return {

                events:
                    events,

                duration:
                    absoluteTime
            };
        }


        // =========================================================
        // PREVIEW
        // =========================================================

        function makePreview(events) {

            const count =
                Math.min(
                    events.length,
                    20
                );

            const lines = [];


            for (
                let i = 0;
                i < count;
                i++
            ) {

                const e =
                    events[i];

                const typeName =
                    e.type === 5
                    ? "ON "
                    : "OFF";


                lines.push(

                    String(e.index)
                        .padStart(3, " ") +

                    "   t=" +

                    e.time
                        .toFixed(6)
                        .padStart(10, " ") +

                    "   " +

                    typeName +

                    "   ch=" +
                    e.channel +

                    "   note=" +
                    e.note +

                    "   vel=" +
                    e.velocity
                );
            }


            if (events.length > count) {

                lines.push(
                    "",
                    "... " +
                    (events.length - count) +
                    " more events"
                );
            }


            return lines.join("\n");
        }


        // =========================================================
        // UI HELPERS
        // =========================================================

        function updateImportButton() {

            document.getElementById(
                "importButton"
            ).disabled = !(
                parsedEvents.length > 0 &&
                bridgeReady &&
                wirelessReady &&
                !importing
            );
        }


        function updateCounters() {

            document.getElementById(
                "completedWrites"
            ).textContent =
                completedWrites;


            document.getElementById(
                "ackCount"
            ).textContent =
                ackCount;


            document.getElementById(
                "nakCount"
            ).textContent =
                nakCount;


            document.getElementById(
                "retryCount"
            ).textContent =
                retryCount;
        }


        function setStatus(text) {

            document.getElementById(
                "status"
            ).textContent =
                text;
        }


        // =========================================================
        // LOAD MIDI FILE
        // =========================================================

        async function loadMidiFile() {

            const button =
                document.getElementById(
                    "loadButton"
                );


            button.disabled = true;

            setStatus(
                "Loading " +
                MIDI_FILENAME +
                "..."
            );


            try {

                const response =
                    await fetch(

                        MIDI_FILENAME +
                        "?t=" +
                        Date.now(),

                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status +
                        " " +
                        response.statusText
                    );
                }


                const text =
                    await response.text();


                const result =
                    parseMidiText(text);


                parsedEvents =
                    result.events;


                document.getElementById(
                    "eventCount"
                ).textContent =
                    parsedEvents.length;


                document.getElementById(
                    "duration"
                ).textContent =
                    result.duration
                        .toFixed(6) +
                    " seconds";


                document.getElementById(
                    "writesRequired"
                ).textContent =
                    parsedEvents.length * 5;


                document.getElementById(
                    "preview"
                ).textContent =
                    makePreview(
                        parsedEvents
                    );


                setStatus(
                    "MIDI loaded and parsed successfully."
                );

            }

            catch (error) {

                setStatus(
                    "ERROR: " +
                    error.message
                );

                console.error(error);

            }

            finally {

                button.disabled = false;

                updateImportButton();
            }
        }


        // =========================================================
        // PATCHWORLD WIRELESS SETUP
        // =========================================================

        async function subscribeToResponses() {

            try {

                document.getElementById(
                    "wirelessStatus"
                ).textContent =
                    "Subscribing...";


                await PatchWorld.subscribeWifi(
                    CHANNELS.ack
                );


                await PatchWorld.subscribeWifi(
                    CHANNELS.nak
                );


                wirelessReady = true;


                document.getElementById(
                    "wirelessStatus"
                ).textContent =
                    "ACK/NAK subscribed";


                updateImportButton();

            }

            catch (error) {

                wirelessReady = false;


                document.getElementById(
                    "wirelessStatus"
                ).textContent =
                    "Subscription ERROR";


                setStatus(
                    "Wireless subscription failed: " +
                    error
                );
            }
        }


        // =========================================================
        // BRIDGE LIFECYCLE
        // =========================================================

        PatchWorld.onData =
            async function(context) {

                bridgeReady = true;


                document.getElementById(
                    "bridgeStatus"
                ).textContent =
                    "Connected";


                await subscribeToResponses();


                updateImportButton();
            };


        PatchWorld.onDisconnected =
            function() {

                bridgeReady = false;

                wirelessReady = false;


                document.getElementById(
                    "bridgeStatus"
                ).textContent =
                    "Disconnected";


                document.getElementById(
                    "wirelessStatus"
                ).textContent =
                    "Not subscribed";


                if (importing) {
                    stopImport(
                        "Bridge disconnected during import."
                    );
                }


                updateImportButton();
            };


        // =========================================================
        // GET CURRENT FIELD
        // =========================================================

        function getCurrentFieldInfo() {

            const event =
                parsedEvents[
                    currentEventIndex
                ];


            const fieldName =
                FIELD_ORDER[
                    currentFieldIndex
                ];


            return {

                event:
                    event,

                fieldName:
                    fieldName,

                index:
                    event.index,

                value:
                    event[fieldName],

                channels:
                    CHANNELS[fieldName]
            };
        }


        // =========================================================
        // SEND ONE ARRAY WRITE
        // =========================================================

        async function sendCurrentWrite() {

            if (
                !importing ||
                abortRequested
            ) {
                return;
            }


            if (
                currentEventIndex >=
                parsedEvents.length
            ) {

                completeImport();

                return;
            }


            const info =
                getCurrentFieldInfo();


            document.getElementById(
                "currentWrite"
            ).textContent =

                info.fieldName +

                "[" +
                info.index +
                "] = " +

                info.value;


            waitingForResponse = true;


            // -------------------------------------------------
            // Set the timeout BEFORE transmission so even an
            // extremely quick Patchworld response is safe.
            // -------------------------------------------------

            clearTimeout(
                responseTimer
            );


            responseTimer =
                setTimeout(

                    function() {

                        if (
                            !waitingForResponse ||
                            !importing
                        ) {
                            return;
                        }


                        waitingForResponse = false;


                        retryCurrentWrite(
                            "ACK timeout"
                        );

                    },

                    ACK_TIMEOUT_MS
                );


            try {

                // ---------------------------------------------
                // DATA ARRAY WRITE SEQUENCE:
                //
                // 1. Write Index
                // 2. Write Value
                //
                // The arrival of Write Value causes the wrapper
                // to write, read back, and issue ACK or NAK.
                // ---------------------------------------------


                await PatchWorld.sendWirelessJolt(
                    info.channels.index,
                    info.index
                );


                await PatchWorld.sendWirelessJolt(
                    info.channels.value,
                    info.value
                );

            }

            catch (error) {

                clearTimeout(
                    responseTimer
                );

                waitingForResponse =
                    false;


                retryCurrentWrite(
                    "Send error: " +
                    error
                );
            }
        }


        // =========================================================
        // ACK / NAK RECEIVE
        // =========================================================

        PatchWorld.onWifiJolt =
            function(channel, value) {


                if (!importing) {
                    return;
                }


                // ---------------------------------------------
                // ACK
                // ---------------------------------------------

                if (
                    channel ===
                    CHANNELS.ack
                ) {

                    if (!waitingForResponse) {
                        return;
                    }


                    clearTimeout(
                        responseTimer
                    );


                    waitingForResponse =
                        false;


                    ackCount++;

                    completedWrites++;

                    retryForCurrentWrite =
                        0;


                    updateCounters();


                    advanceToNextWrite();

                    return;
                }


                // ---------------------------------------------
                // NAK
                // ---------------------------------------------

                if (
                    channel ===
                    CHANNELS.nak
                ) {

                    if (!waitingForResponse) {
                        return;
                    }


                    clearTimeout(
                        responseTimer
                    );


                    waitingForResponse =
                        false;


                    nakCount++;


                    updateCounters();


                    retryCurrentWrite(
                        "NAK received"
                    );
                }
            };


        // =========================================================
        // ADVANCE
        // =========================================================

        function advanceToNextWrite() {

            currentFieldIndex++;


            if (
                currentFieldIndex >=
                FIELD_ORDER.length
            ) {

                currentFieldIndex = 0;

                currentEventIndex++;
            }


            if (
                currentEventIndex >=
                parsedEvents.length
            ) {

                completeImport();

                return;
            }


            sendCurrentWrite();
        }


        // =========================================================
        // RETRY
        // =========================================================

        function retryCurrentWrite(reason) {

            retryForCurrentWrite++;

            retryCount++;


            updateCounters();


            if (
                retryForCurrentWrite >
                MAX_RETRIES
            ) {

                const info =
                    getCurrentFieldInfo();


                stopImport(

                    "FAILED: " +

                    info.fieldName +

                    "[" +
                    info.index +
                    "] after " +

                    MAX_RETRIES +

                    " retries. " +

                    reason
                );


                return;
            }


            setStatus(

                "Retry " +

                retryForCurrentWrite +

                "/" +

                MAX_RETRIES +

                ": " +

                reason
            );


            // Yield one browser event turn before retrying.

            setTimeout(
                sendCurrentWrite,
                0
            );
        }


        // =========================================================
        // START IMPORT
        // =========================================================

        function startImport() {

            if (
                parsedEvents.length === 0 ||
                !bridgeReady ||
                !wirelessReady
            ) {
                return;
            }


            importing = true;

            abortRequested = false;


            currentEventIndex = 0;

            currentFieldIndex = 0;

            completedWrites = 0;

            ackCount = 0;

            nakCount = 0;

            retryCount = 0;

            retryForCurrentWrite = 0;

            waitingForResponse = false;


            updateCounters();


            document.getElementById(
                "importButton"
            ).disabled = true;


            document.getElementById(
                "loadButton"
            ).disabled = true;


            document.getElementById(
                "abortButton"
            ).disabled = false;


            setStatus(
                "Import started..."
            );


            sendCurrentWrite();
        }


        // =========================================================
        // COMPLETE
        // =========================================================

        function completeImport() {

            clearTimeout(
                responseTimer
            );


            importing = false;

            waitingForResponse = false;


            document.getElementById(
                "abortButton"
            ).disabled = true;


            document.getElementById(
                "loadButton"
            ).disabled = false;


            document.getElementById(
                "currentWrite"
            ).textContent =
                "Complete";


            setStatus(

                "IMPORT COMPLETE — " +

                completedWrites +

                " verified writes."
            );


            updateImportButton();
        }


        // =========================================================
        // ABORT / FAILURE
        // =========================================================

        function stopImport(reason) {

            clearTimeout(
                responseTimer
            );


            abortRequested = true;

            importing = false;

            waitingForResponse = false;


            document.getElementById(
                "abortButton"
            ).disabled = true;


            document.getElementById(
                "loadButton"
            ).disabled = false;


            setStatus(reason);


            updateImportButton();
        }


        // =========================================================
        // BUTTONS
        // =========================================================

        document.getElementById(
            "loadButton"
        ).addEventListener(
            "click",
            loadMidiFile
        );


        document.getElementById(
            "importButton"
        ).addEventListener(
            "click",
            startImport
        );


        document.getElementById(
            "abortButton"
        ).addEventListener(
            "click",
            function() {

                stopImport(
                    "Import aborted by user."
                );
            }
        );

    </script>

</body>
</html>
