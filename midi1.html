<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patchworld MIDI Importer</title>

    <style>
        body {
            font-family: sans-serif;
            background: #181818;
            color: #eeeeee;
            margin: 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        #revision {
            font-weight: bold;
            margin-bottom: 20px;
        }

        .section {
            margin-top: 18px;
            padding: 14px;
            background: #282828;
            border-radius: 8px;
        }

        .label {
            color: #aaaaaa;
        }

        button,
        select,
        input[type="number"] {
            font-size: 18px;
            padding: 10px 18px;
            margin-top: 10px;
            margin-right: 8px;
        }

        select {
            min-width: 320px;
        }

        input[type="number"] {
            width: 140px;
        }

        pre {
            background: #111111;
            padding: 12px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            max-height: 400px;
            overflow-y: auto;
        }

        #status {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .good {
            color: #69d36f;
        }

        .bad {
            color: #ff6b6b;
        }

        .value {
            font-family: monospace;
        }
    </style>
</head>

<body>

    <div id="revision">REV 4</div>

    <h1>Patchworld MIDI Importer</h1>

    <div class="section">
        <div>
            <span class="label">Bridge:</span>
            <span id="bridgeStatus">Waiting...</span>
        </div>

        <div>
            <span class="label">Wireless:</span>
            <span id="wirelessStatus">Not subscribed</span>
        </div>
    </div>


    <div class="section">

        <div>
            <span class="label">MIDI file:</span>
        </div>

        <select id="fileSelect" disabled>
            <option>Loading file list...</option>
        </select>

        <br>

        <button id="loadButton" disabled>
            Load and Parse Selected MIDI
        </button>

        <button id="importButton" disabled>
            Start Import
        </button>

        <button id="abortButton" disabled>
            Abort
        </button>

    </div>


    <div class="section">

        <div id="status">
            Waiting.
        </div>

        <div>
            <span class="label">Selected file:</span>
            <span id="selectedFile">-</span>
        </div>

        <div>
            <span class="label">Playable events:</span>
            <span id="eventCount">-</span>
        </div>

        <div>
            <span class="label">Events to import:</span>

            <input
                type="number"
                id="eventLimit"
                min="1"
                step="1"
                value="1"
                disabled
            >
        </div>

        <div>
            <span class="label">Duration:</span>
            <span id="duration">-</span>
        </div>

        <div>
            <span class="label">Writes required:</span>
            <span id="writesRequired">-</span>
        </div>

    </div>


    <div class="section">

        <div>
            <span class="label">Current write:</span>
            <span id="currentWrite" class="value">-</span>
        </div>

        <div>
            <span class="label">Completed writes:</span>
            <span id="completedWrites">0</span>
        </div>

        <div>
            <span class="label">ACKs:</span>
            <span id="ackCount" class="good">0</span>
        </div>

        <div>
            <span class="label">NAKs:</span>
            <span id="nakCount" class="bad">0</span>
        </div>

        <div>
            <span class="label">Retries:</span>
            <span id="retryCount">0</span>
        </div>

    </div>


    <div class="section">
        <div class="label">Parsed event preview:</div>
        <pre id="preview">No MIDI loaded yet.</pre>
    </div>


    <script>
        document.write(
            '<script src="patchworld-bridge.js?t=' +
            Date.now() +
            '"><\/script>'
        );
    </script>


    <script>

        // =========================================================
        // CONFIGURATION
        // =========================================================

        const FILE_LIST_NAME =
            "midifiles.txt";


        const CHANNELS = {

            time: {
                index: "midi_time_index",
                value: "midi_time_value"
            },

            type: {
                index: "midi_type_index",
                value: "midi_type_value"
            },

            note: {
                index: "midi_note_index",
                value: "midi_note_value"
            },

            velocity: {
                index: "midi_velocity_index",
                value: "midi_velocity_value"
            },

            channel: {
                index: "midi_channel_index",
                value: "midi_channel_value"
            },

            ack: "midi_ack",
            nak: "midi_nak"
        };


        const FIELD_ORDER = [
            "time",
            "type",
            "note",
            "velocity",
            "channel"
        ];


        const MAX_RETRIES = 5;

        const ACK_TIMEOUT_MS = 2000;


        // =========================================================
        // STATE
        // =========================================================

        let parsedEvents = [];

        let bridgeReady = false;
        let wirelessReady = false;

        let importing = false;
        let abortRequested = false;

        let currentEventIndex = 0;
        let currentFieldIndex = 0;

        let completedWrites = 0;
        let ackCount = 0;
        let nakCount = 0;
        let retryCount = 0;
        let retryForCurrentWrite = 0;

        let waitingForResponse = false;
        let responseTimer = null;

        let importEventLimit = 0;


        // =========================================================
        // MIDI FILE LIST
        // =========================================================

        async function loadFileList() {

            const select =
                document.getElementById("fileSelect");

            const loadButton =
                document.getElementById("loadButton");


            try {

                const response =
                    await fetch(
                        FILE_LIST_NAME +
                        "?t=" +
                        Date.now(),
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status +
                        " " +
                        response.statusText
                    );
                }


                const text =
                    await response.text();


                const files =
                    text
                        .split(/\r?\n/)
                        .map(line => line.trim())
                        .filter(line => line.length > 0);


                select.innerHTML = "";


                if (files.length === 0) {

                    const option =
                        document.createElement("option");

                    option.textContent =
                        "No MIDI files listed";

                    select.appendChild(option);

                    select.disabled = true;
                    loadButton.disabled = true;

                    setStatus(
                        "midifiles.txt contains no filenames."
                    );

                    return;
                }


                for (const filename of files) {

                    const option =
                        document.createElement("option");

                    option.value =
                        filename;

                    option.textContent =
                        filename;

                    select.appendChild(option);
                }


                select.disabled = false;
                loadButton.disabled = false;


                document.getElementById(
                    "selectedFile"
                ).textContent =
                    select.value;


                setStatus(
                    "MIDI file list loaded."
                );

            }

            catch (error) {

                select.innerHTML =
                    "<option>File list error</option>";

                select.disabled = true;
                loadButton.disabled = true;


                setStatus(
                    "ERROR loading midifiles.txt: " +
                    error.message
                );
            }
        }


        // =========================================================
        // MIDI PARSER
        // =========================================================

        function extractDeltaTime(line) {

            const match = line.match(
                /\btime=([-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?)/
            );

            if (!match) {
                return 0;
            }

            const value =
                Number(match[1]);

            return Number.isFinite(value)
                ? value
                : 0;
        }


        function extractNumber(line, fieldName) {

            const expression =
                new RegExp(
                    "\\b" +
                    fieldName +
                    "=([-+]?\\d+(?:\\.\\d+)?)"
                );


            const match =
                line.match(expression);


            if (!match) {
                return null;
            }


            const value =
                Number(match[1]);


            return Number.isFinite(value)
                ? value
                : null;
        }


        function parseMidiText(text) {

            const lines =
                text.split(/\r?\n/);

            const events = [];

            let absoluteTime = 0;


            for (const rawLine of lines) {

                const line =
                    rawLine.trim();


                if (line.length === 0) {
                    continue;
                }


                absoluteTime +=
                    extractDeltaTime(line);


                const isNoteOn =
                    line.startsWith("note_on ");

                const isNoteOff =
                    line.startsWith("note_off ");


                if (!isNoteOn && !isNoteOff) {
                    continue;
                }


                const channel =
                    extractNumber(
                        line,
                        "channel"
                    );

                const note =
                    extractNumber(
                        line,
                        "note"
                    );

                const velocity =
                    extractNumber(
                        line,
                        "velocity"
                    );


                if (
                    channel === null ||
                    note === null ||
                    velocity === null
                ) {

                    console.warn(
                        "Skipping malformed MIDI event:",
                        line
                    );

                    continue;
                }


                events.push({

                    index:
                        events.length,

                    time:
                        absoluteTime,

                    type:
                        isNoteOn ? 5 : 6,

                    note:
                        note,

                    velocity:
                        velocity,

                    channel:
                        channel,

                    originalLine:
                        line
                });
            }


            return {

                events:
                    events,

                duration:
                    absoluteTime
            };
        }


        // =========================================================
        // PREVIEW
        // =========================================================

        function makePreview(events) {

            const count =
                Math.min(
                    events.length,
                    20
                );

            const lines = [];


            for (
                let i = 0;
                i < count;
                i++
            ) {

                const e =
                    events[i];


                const typeName =
                    e.type === 5
                    ? "ON "
                    : "OFF";


                lines.push(

                    String(e.index)
                        .padStart(3, " ") +

                    "   t=" +

                    e.time
                        .toFixed(6)
                        .padStart(10, " ") +

                    "   " +

                    typeName +

                    "   ch=" +
                    e.channel +

                    "   note=" +
                    e.note +

                    "   vel=" +
                    e.velocity
                );
            }


            if (events.length > count) {

                lines.push(
                    "",
                    "... " +
                    (events.length - count) +
                    " more events"
                );
            }


            return lines.join("\n");
        }


        // =========================================================
        // EVENT LIMIT
        // =========================================================

        function getEventLimit() {

            if (parsedEvents.length === 0) {
                return 0;
            }


            const input =
                document.getElementById(
                    "eventLimit"
                );


            let value =
                parseInt(
                    input.value,
                    10
                );


            if (!Number.isFinite(value)) {

                value =
                    parsedEvents.length;
            }


            value =
                Math.max(
                    1,
                    Math.min(
                        value,
                        parsedEvents.length
                    )
                );


            input.value =
                value;


            return value;
        }


        function updateWriteCount() {

            if (parsedEvents.length === 0) {

                document.getElementById(
                    "writesRequired"
                ).textContent =
                    "-";

                return;
            }


            document.getElementById(
                "writesRequired"
            ).textContent =
                getEventLimit() *
                FIELD_ORDER.length;
        }


        // =========================================================
        // UI HELPERS
        // =========================================================

        function setStatus(text) {

            document.getElementById(
                "status"
            ).textContent =
                text;
        }


        function updateImportButton() {

            document.getElementById(
                "importButton"
            ).disabled = !(
                parsedEvents.length > 0 &&
                bridgeReady &&
                wirelessReady &&
                !importing
            );
        }


        function updateCounters() {

            document.getElementById(
                "completedWrites"
            ).textContent =
                completedWrites;


            document.getElementById(
                "ackCount"
            ).textContent =
                ackCount;


            document.getElementById(
                "nakCount"
            ).textContent =
                nakCount;


            document.getElementById(
                "retryCount"
            ).textContent =
                retryCount;
        }


        // =========================================================
        // LOAD SELECTED MIDI
        // =========================================================

        async function loadMidiFile() {

            const select =
                document.getElementById(
                    "fileSelect"
                );


            const filename =
                select.value;


            if (!filename) {
                return;
            }


            const button =
                document.getElementById(
                    "loadButton"
                );


            button.disabled = true;


            setStatus(
                "Loading " +
                filename +
                "..."
            );


            document.getElementById(
                "selectedFile"
            ).textContent =
                filename;


            try {

                const response =
                    await fetch(

                        encodeURI(filename) +
                        "?t=" +
                        Date.now(),

                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status +
                        " " +
                        response.statusText
                    );
                }


                const text =
                    await response.text();


                const result =
                    parseMidiText(text);


                parsedEvents =
                    result.events;


                document.getElementById(
                    "eventCount"
                ).textContent =
                    parsedEvents.length;


                const eventLimitInput =
                    document.getElementById(
                        "eventLimit"
                    );


                if (parsedEvents.length > 0) {

                    eventLimitInput.min =
                        1;

                    eventLimitInput.max =
                        parsedEvents.length;

                    eventLimitInput.value =
                        parsedEvents.length;

                    eventLimitInput.disabled =
                        false;

                } else {

                    eventLimitInput.value =
                        1;

                    eventLimitInput.disabled =
                        true;
                }


                document.getElementById(
                    "duration"
                ).textContent =
                    result.duration
                        .toFixed(6) +
                    " seconds";


                document.getElementById(
                    "preview"
                ).textContent =
                    makePreview(
                        parsedEvents
                    );


                updateWriteCount();


                setStatus(
                    "MIDI loaded and parsed successfully."
                );

            }

            catch (error) {

                parsedEvents = [];


                document.getElementById(
                    "eventCount"
                ).textContent =
                    "-";


                document.getElementById(
                    "duration"
                ).textContent =
                    "-";


                document.getElementById(
                    "writesRequired"
                ).textContent =
                    "-";


                document.getElementById(
                    "preview"
                ).textContent =
                    "No parsed MIDI data.";


                document.getElementById(
                    "eventLimit"
                ).disabled =
                    true;


                setStatus(
                    "ERROR: " +
                    error.message
                );

            }

            finally {

                button.disabled = false;

                updateImportButton();
            }
        }


        // =========================================================
        // PATCHWORLD WIRELESS SETUP
        // =========================================================

        async function subscribeToResponses() {

            try {

                document.getElementById(
                    "wirelessStatus"
                ).textContent =
                    "Subscribing...";


                await PatchWorld.subscribeWifi(
                    CHANNELS.ack
                );


                await PatchWorld.subscribeWifi(
                    CHANNELS.nak
                );


                wirelessReady = true;


                document.getElementById(
                    "wirelessStatus"
                ).textContent =
                    "ACK/NAK subscribed";


                updateImportButton();

            }

            catch (error) {

                wirelessReady = false;


                document.getElementById(
                    "wirelessStatus"
                ).textContent =
                    "Subscription ERROR";


                setStatus(
                    "Wireless subscription failed: " +
                    error
                );
            }
        }


        // =========================================================
        // BRIDGE LIFECYCLE
        // =========================================================

        PatchWorld.onData =
            async function(context) {

                bridgeReady = true;


                document.getElementById(
                    "bridgeStatus"
                ).textContent =
                    "Connected";


                await subscribeToResponses();


                updateImportButton();
            };


        PatchWorld.onDisconnected =
            function() {

                bridgeReady = false;

                wirelessReady = false;


                document.getElementById(
                    "bridgeStatus"
                ).textContent =
                    "Disconnected";


                document.getElementById(
                    "wirelessStatus"
                ).textContent =
                    "Not subscribed";


                if (importing) {

                    stopImport(
                        "Bridge disconnected during import."
                    );
                }


                updateImportButton();
            };


        // =========================================================
        // CURRENT FIELD
        // =========================================================

        function getCurrentFieldInfo() {

            const event =
                parsedEvents[
                    currentEventIndex
                ];


            const fieldName =
                FIELD_ORDER[
                    currentFieldIndex
                ];


            return {

                event:
                    event,

                fieldName:
                    fieldName,

                index:
                    event.index,

                value:
                    event[fieldName],

                channels:
                    CHANNELS[fieldName]
            };
        }


        // =========================================================
        // SEND ONE ARRAY WRITE
        // =========================================================

        async function sendCurrentWrite() {

            if (
                !importing ||
                abortRequested
            ) {
                return;
            }


            if (
                currentEventIndex >=
                importEventLimit
            ) {

                completeImport();

                return;
            }


            const info =
                getCurrentFieldInfo();


            document.getElementById(
                "currentWrite"
            ).textContent =

                info.fieldName +

                "[" +
                info.index +
                "] = " +

                info.value;


            waitingForResponse = true;


            clearTimeout(
                responseTimer
            );


            responseTimer =
                setTimeout(

                    function() {

                        if (
                            !waitingForResponse ||
                            !importing
                        ) {
                            return;
                        }


                        waitingForResponse =
                            false;


                        retryCurrentWrite(
                            "ACK timeout"
                        );

                    },

                    ACK_TIMEOUT_MS
                );


            try {

                await PatchWorld.sendWirelessJolt(
                    info.channels.index,
                    info.index
                );


                await PatchWorld.sendWirelessJolt(
                    info.channels.value,
                    info.value
                );

            }

            catch (error) {

                clearTimeout(
                    responseTimer
                );


                waitingForResponse =
                    false;


                retryCurrentWrite(
                    "Send error: " +
                    error
                );
            }
        }


        // =========================================================
        // ACK / NAK
        // =========================================================

        PatchWorld.onWifiJolt =
            function(channel, value) {


                if (!importing) {
                    return;
                }


                if (
                    channel ===
                    CHANNELS.ack
                ) {

                    if (!waitingForResponse) {
                        return;
                    }


                    clearTimeout(
                        responseTimer
                    );


                    waitingForResponse =
                        false;


                    ackCount++;

                    completedWrites++;

                    retryForCurrentWrite =
                        0;


                    updateCounters();


                    advanceToNextWrite();

                    return;
                }


                if (
                    channel ===
                    CHANNELS.nak
                ) {

                    if (!waitingForResponse) {
                        return;
                    }


                    clearTimeout(
                        responseTimer
                    );


                    waitingForResponse =
                        false;


                    nakCount++;


                    updateCounters();


                    retryCurrentWrite(
                        "NAK received"
                    );
                }
            };


        // =========================================================
        // ADVANCE
        // =========================================================

        function advanceToNextWrite() {

            currentFieldIndex++;


            if (
                currentFieldIndex >=
                FIELD_ORDER.length
            ) {

                currentFieldIndex = 0;

                currentEventIndex++;
            }


            if (
                currentEventIndex >=
                importEventLimit
            ) {

                completeImport();

                return;
            }


            sendCurrentWrite();
        }


        // =========================================================
        // RETRY
        // =========================================================

        function retryCurrentWrite(reason) {

            retryForCurrentWrite++;

            retryCount++;


            updateCounters();


            if (
                retryForCurrentWrite >
                MAX_RETRIES
            ) {

                const info =
                    getCurrentFieldInfo();


                stopImport(

                    "FAILED: " +

                    info.fieldName +

                    "[" +
                    info.index +
                    "] after " +

                    MAX_RETRIES +

                    " retries. " +

                    reason
                );


                return;
            }


            setStatus(

                "Retry " +

                retryForCurrentWrite +

                "/" +

                MAX_RETRIES +

                ": " +

                reason
            );


            setTimeout(
                sendCurrentWrite,
                0
            );
        }


        // =========================================================
        // START IMPORT
        // =========================================================

        function startImport() {

            if (
                parsedEvents.length === 0 ||
                !bridgeReady ||
                !wirelessReady
            ) {
                return;
            }


            importEventLimit =
                getEventLimit();


            importing = true;

            abortRequested = false;


            currentEventIndex = 0;

            currentFieldIndex = 0;

            completedWrites = 0;

            ackCount = 0;

            nakCount = 0;

            retryCount = 0;

            retryForCurrentWrite = 0;

            waitingForResponse = false;


            updateCounters();


            document.getElementById(
                "importButton"
            ).disabled = true;


            document.getElementById(
                "loadButton"
            ).disabled = true;


            document.getElementById(
                "fileSelect"
            ).disabled = true;


            document.getElementById(
                "eventLimit"
            ).disabled = true;


            document.getElementById(
                "abortButton"
            ).disabled = false;


            setStatus(
                "Import started..."
            );


            sendCurrentWrite();
        }


        // =========================================================
        // COMPLETE
        // =========================================================

        function completeImport() {

            clearTimeout(
                responseTimer
            );


            importing = false;

            waitingForResponse = false;


            document.getElementById(
                "abortButton"
            ).disabled = true;


            document.getElementById(
                "loadButton"
            ).disabled = false;


            document.getElementById(
                "fileSelect"
            ).disabled = false;


            document.getElementById(
                "eventLimit"
            ).disabled = false;


            document.getElementById(
                "currentWrite"
            ).textContent =
                "Complete";


            setStatus(

                "IMPORT COMPLETE — " +

                completedWrites +

                " verified writes."
            );


            updateImportButton();
        }


        // =========================================================
        // ABORT / FAILURE
        // =========================================================

        function stopImport(reason) {

            clearTimeout(
                responseTimer
            );


            abortRequested = true;

            importing = false;

            waitingForResponse = false;


            document.getElementById(
                "abortButton"
            ).disabled = true;


            document.getElementById(
                "loadButton"
            ).disabled = false;


            document.getElementById(
                "fileSelect"
            ).disabled = false;


            document.getElementById(
                "eventLimit"
            ).disabled =
                parsedEvents.length === 0;


            setStatus(reason);


            updateImportButton();
        }


        // =========================================================
        // UI EVENTS
        // =========================================================

        document.getElementById(
            "fileSelect"
        ).addEventListener(
            "change",
            function() {

                document.getElementById(
                    "selectedFile"
                ).textContent =
                    this.value;


                parsedEvents = [];


                document.getElementById(
                    "eventCount"
                ).textContent =
                    "-";


                document.getElementById(
                    "duration"
                ).textContent =
                    "-";


                document.getElementById(
                    "writesRequired"
                ).textContent =
                    "-";


                document.getElementById(
                    "preview"
                ).textContent =
                    "Selected file has not been parsed yet.";


                document.getElementById(
                    "eventLimit"
                ).disabled =
                    true;


                updateImportButton();
            }
        );


        document.getElementById(
            "eventLimit"
        ).addEventListener(
            "input",
            updateWriteCount
        );


        document.getElementById(
            "eventLimit"
        ).addEventListener(
            "change",
            function() {

                getEventLimit();
                updateWriteCount();
            }
        );


        document.getElementById(
            "loadButton"
        ).addEventListener(
            "click",
            loadMidiFile
        );


        document.getElementById(
            "importButton"
        ).addEventListener(
            "click",
            startImport
        );


        document.getElementById(
            "abortButton"
        ).addEventListener(
            "click",
            function() {

                stopImport(
                    "Import aborted by user."
                );
            }
        );


        // =========================================================
        // INITIALIZE
        // =========================================================

        loadFileList();

    </script>

</body>
</html>
